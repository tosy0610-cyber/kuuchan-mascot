<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>くーちゃん マスコット デザイン案(水彩・色えらび)</title>
<style>body{margin:0;background:#FBF6EE;color:#4a2c1d;font-family:-apple-system,"Hiragino Sans",sans-serif;line-height:1.7}
header{padding:32px 20px 8px;text-align:center}h1{font-size:1.5rem;margin:0}p.lead{max-width:640px;margin:8px auto;font-size:1rem}
section{max-width:1100px;margin:32px auto;padding:0 16px}h2{border-left:8px solid #E8745F;padding-left:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
figure{margin:0;background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(120,70,40,.12)}
img{width:100%;border-radius:10px;display:block}figcaption{padding:10px 4px 2px;font-size:1rem}small{color:#7a5a48}
footer{text-align:center;padding:24px;font-size:.9rem}</style></head><body>
<header><h1>くーちゃん マスコット デザイン案</h1><p class="lead">ペンギンとチワワ、5つのタッチで並べました。気になる番号(例:「ペンギン③」「チワワ⑤」)を教えてください。ポーズは後から変えられます。画像をタップすると大きく見られます。</p></header><section class="pick"><h2>★ 採用:水彩タッチ — 色を選んでください</h2><p>キャラと構図はそのまま、色だけ5パターンにしました。好きな記号(例:「ペンギン色B」「チワワ色E」)を教えてください。</p></section><section><h2>🐧 ペンギン(水彩)色ちがい</h2><div class="grid"><figure><img src="images/penguin-w1.jpg" alt="ペンギン水彩 色1" loading="lazy"><figcaption><b>ペンギン 色A</b> ラベンダー×ミント</figcaption></figure><figure><img src="images/penguin-w2.jpg" alt="ペンギン水彩 色2" loading="lazy"><figcaption><b>ペンギン 色B</b> セージグリーン×ベージュ</figcaption></figure><figure><img src="images/penguin-w3.jpg" alt="ペンギン水彩 色3" loading="lazy"><figcaption><b>ペンギン 色C</b> ブルーグレー×アイボリー</figcaption></figure><figure><img src="images/penguin-w4.jpg" alt="ペンギン水彩 色4" loading="lazy"><figcaption><b>ペンギン 色D</b> はちみつ×テラコッタ</figcaption></figure><figure><img src="images/penguin-w5.jpg" alt="ペンギン水彩 色5" loading="lazy"><figcaption><b>ペンギン 色E</b> くすみピンク×グレージュ</figcaption></figure></div></section><section><h2>🐶 チワワ(水彩)色ちがい</h2><div class="grid"><figure><img src="images/chihuahua-w1.jpg" alt="チワワ水彩 色1" loading="lazy"><figcaption><b>チワワ 色A</b> ラベンダー×ミント</figcaption></figure><figure><img src="images/chihuahua-w2.jpg" alt="チワワ水彩 色2" loading="lazy"><figcaption><b>チワワ 色B</b> セージグリーン×ベージュ</figcaption></figure><figure><img src="images/chihuahua-w3.jpg" alt="チワワ水彩 色3" loading="lazy"><figcaption><b>チワワ 色C</b> ブルーグレー×アイボリー</figcaption></figure><figure><img src="images/chihuahua-w4.jpg" alt="チワワ水彩 色4" loading="lazy"><figcaption><b>チワワ 色D</b> はちみつ×テラコッタ</figcaption></figure><figure><img src="images/chihuahua-w5.jpg" alt="チワワ水彩 色5" loading="lazy"><figcaption><b>チワワ 色E</b> くすみピンク×グレージュ</figcaption></figure></div></section><section><h2 style="border-color:#bbb">これまでのタッチ比較(参考)</h2></section>
<section><h2>🐧 ペンギン</h2><div class="grid"><figure><img src="images/penguin-1.jpg" alt="ペンギン1" loading="lazy"><figcaption><b>ペンギン①</b> フラット<br><small>シンプルでくっきり。SNSで一番読みやすい</small></figcaption></figure><figure><img src="images/penguin-2.jpg" alt="ペンギン2" loading="lazy"><figcaption><b>ペンギン②</b> 水彩・コーヒー<br><small>やさしくてほっこり。癒やし系</small></figcaption></figure><figure><img src="images/penguin-3.jpg" alt="ペンギン3" loading="lazy"><figcaption><b>ペンギン③</b> ちびキャラ・シール風<br><small>LINEスタンプのようにポップでかわいい</small></figcaption></figure><figure><img src="images/penguin-4.jpg" alt="ペンギン4" loading="lazy"><figcaption><b>ペンギン④</b> クレヨン・ハートのしおり<br><small>手描きのあたたかさ。絵本の雰囲気</small></figcaption></figure><figure><img src="images/penguin-5.jpg" alt="ペンギン5" loading="lazy"><figcaption><b>ペンギン⑤</b> ぬいぐるみ3D・コンパス<br><small>ふわふわで信頼感。「自分軸」を連想</small></figcaption></figure></div></section><section><h2>🐶 チワワ</h2><div class="grid"><figure><img src="images/chihuahua-1.jpg" alt="チワワ1" loading="lazy"><figcaption><b>チワワ①</b> フラット<br><small>シンプルでくっきり。SNSで一番読みやすい</small></figcaption></figure><figure><img src="images/chihuahua-2.jpg" alt="チワワ2" loading="lazy"><figcaption><b>チワワ②</b> 水彩・コーヒー<br><small>やさしくてほっこり。癒やし系</small></figcaption></figure><figure><img src="images/chihuahua-3.jpg" alt="チワワ3" loading="lazy"><figcaption><b>チワワ③</b> ちびキャラ・シール風<br><small>LINEスタンプのようにポップでかわいい</small></figcaption></figure><figure><img src="images/chihuahua-4.jpg" alt="チワワ4" loading="lazy"><figcaption><b>チワワ④</b> クレヨン・ハートのしおり<br><small>手描きのあたたかさ。絵本の雰囲気</small></figcaption></figure><figure><img src="images/chihuahua-5.jpg" alt="チワワ5" loading="lazy"><figcaption><b>チワワ⑤</b> ぬいぐるみ3D・コンパス<br><small>ふわふわで信頼感。「自分軸」を連想</small></figcaption></figure></div></section>
<footer>色はコーラル・ピーチ・クリームでそろえています</footer>
