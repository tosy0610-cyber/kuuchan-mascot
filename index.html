<header><h1>くーちゃん マスコット キャラクター集</h1><p class="lead">水彩タッチ(コーラル・ピーチ・クリーム)のペンギンとチワワ。いろいろな気持ちと場面、ふたりのケンカ→涙→仲直りのお話です。画像をタップすると大きく見られます。</p>
<nav><a href="#penguin">🐧 ペンギン</a><a href="#chihuahua">🐶 チワワ</a><a href="#story">🐧🐶 ふたりのお話</a></nav></header>
<section id="penguin"><h2>🐧 ペンギン(20場面)</h2><div class="grid"><figure><img src="images/final/penguin-01.jpg" alt="喜び" loading="lazy"><figcaption><b>喜び</b><br><small>両手を上げてバンザイ、満面の笑顔</small></figcaption></figure><figure><img src="images/final/penguin-02.jpg" alt="怒り" loading="lazy"><figcaption><b>怒り</b><br><small>ほっぺをふくらませてぷんぷん怒っている、頭に小さな湯気</small></figcaption></figure><figure><img src="images/final/penguin-03.jpg" alt="哀しみ" loading="lazy"><figcaption><b>哀しみ</b><br><small>目に涙をためて、ぽろりと涙がこぼれる</small></figcaption></figure><figure><img src="images/final/penguin-04.jpg" alt="楽しい" loading="lazy"><figcaption><b>楽しい</b><br><small>音符を浮かべながら楽しそうにスキップ</small></figcaption></figure><figure><img src="images/final/penguin-05.jpg" alt="驚き" loading="lazy"><figcaption><b>驚き</b><br><small>目をまんまるにしてびっくり、頭に小さなびっくりマーク</small></figcaption></figure><figure><img src="images/final/penguin-06.jpg" alt="照れ" loading="lazy"><figcaption><b>照れ</b><br><small>顔を赤くしてもじもじ、手で顔を少し隠す</small></figcaption></figure><figure><img src="images/final/penguin-07.jpg" alt="考え中" loading="lazy"><figcaption><b>考え中</b><br><small>首をかしげて考えている、頭の上に小さなはてなマーク</small></figcaption></figure><figure><img src="images/final/penguin-08.jpg" alt="ほっと一息" loading="lazy"><figcaption><b>ほっと一息</b><br><small>マグカップのお茶を飲んでほっとする</small></figcaption></figure><figure><img src="images/final/penguin-09.jpg" alt="おやすみ" loading="lazy"><figcaption><b>おやすみ</b><br><small>ブランケットにくるまってすやすや眠る</small></figcaption></figure><figure><img src="images/final/penguin-10.jpg" alt="おはよう" loading="lazy"><figcaption><b>おはよう</b><br><small>朝の光の中で大きく伸びをする</small></figcaption></figure><figure><img src="images/final/penguin-11.jpg" alt="読書" loading="lazy"><figcaption><b>読書</b><br><small>座って本を読む</small></figcaption></figure><figure><img src="images/final/penguin-12.jpg" alt="日記" loading="lazy"><figcaption><b>日記</b><br><small>小さなノートにペンで日記を書く</small></figcaption></figure><figure><img src="images/final/penguin-13.jpg" alt="お散歩" loading="lazy"><figcaption><b>お散歩</b><br><smal <section id="story"><h2>🐧🐶 ふたりのお話</h2>
<h3>① ケンカ</h3><div class="grid"><figure><img src="images/final/duo-fight-1.jpg" alt="ケンカ1" loading="lazy"><figcaption><b>ケンカ1</b><br><small>1枚のクッキーを両側から引っぱり合う</small></figcaption></figure><figure><img src="images/final/duo-fight-2.jpg" alt="ケンカ2" loading="lazy"><figcaption><b>ケンカ2</b><br><small>背中合わせでぷいっとそっぽを向く</small></figcaption></figure><figure><img src="images/final/duo-fight-3.jpg" alt="ケンカ3" loading="lazy"><figcaption><b>ケンカ3</b><br><small>おでこを近づけてにらみ合う、間に小さな火花</small></figcaption></figure><figure><img src="images/final/duo-fight-4.jpg" alt="ケンカ4" loading="lazy"><figcaption><b>ケンカ4</b><br><small>ふたりともぷんぷん怒って言い合っている(吹き出しなし)</small></figcaption></figure><figure><img src="images/final/duo-fight-5.jpg" alt="ケンカ5" loading="lazy"><figcaption><b>ケンカ5</b><br><small>怒ったまま反対方向へ歩いていく</small></figcaption></figure></div><h3>② 涙</h3><div class="grid"><figure><img src="images/final/duo-cry-1.jpg" alt="涙1" loading="lazy"><figcaption><b>涙1</b><br><small>ペンギンがひとりで座ってぽろぽろ泣いている、チワワは遠くに小さく</small></figcaption></figure><figure><img src="images/final/duo-cry-2.jpg" alt="涙2" loading="lazy"><figcaption><b>涙2</b><br><small>チワワがひとりで座ってぽろぽろ泣いている、ペンギンは遠くに小さく</small></figcaption></figure><figure><img src="images/final/duo-cry-3.jpg" alt="涙3" loading="lazy"><figcaption><b>涙3</b><br><small>離れた場所でふたりとも背中を丸めて泣いている</small></figcaption></figure><figure><img src="images/final/duo-cry-4.jpg" alt="涙4" loading="lazy"><figcaption><b>涙4</b><br><small>ふたりとも涙をふきながら、ちらっと相手のほうを振り返る</small></figcaption></figure><figure><img src="images/final/duo-cry-5.jpg" alt="涙5" loading="lazy"><figcaption><b>涙5</b><br><small>ふたりとも、割れたクッキーを見つめてしょんぼり反省している</small></figcaption></figure></div><h3>③ 仲直り</h3><div class="grid"><figure><img src="images/final/duo-makeup-1.jpg" alt="仲直り1" loading="lazy"><figcaption><b>仲直り1</b><br><small>ペンギンがそっとチワワに近づいて声をかけようとしている</small></figcaption></figure><figure><img src="images/final/duo-makeup-2.jpg" alt="仲直り2" loading="lazy"><figcaption><b>仲直り2</b><br><small>クッキーを半分こして差し出す</small></figcaption></figure><figure><img src="images/final/duo-makeup-3.jpg" alt="仲直り3" loading="lazy"><figcaption><b>仲直り3</b><br><small>涙目のままぎゅっとハグする</small></figcaption></figure><figure><img src="images/final/duo-makeup-4.jpg" alt="仲直り4" loading="lazy"><figcaption><b>仲直り4</b><br><small>手をつないでにっこり笑い合う</small></figcaption></figure><figure><img src="images/final/duo-makeup-5.jpg" alt="仲直り5" loading="lazy"><figcaption><b>仲直り5</b><br><small>並んで座り、一緒にマグカップでほっと一息、周りに小さなハート</small></figcaption></figure></div></section>
